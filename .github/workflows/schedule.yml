name: Update SupOptique Calendars

on:
  schedule:
    # Se lance toutes les 2 heures
    - cron: '0 */2 * * *'
  # Permet de lancer manuellement pour tester
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests ics

      - name: Run script
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: |
          python export_supoptique.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # La commande suivante ajoute TOUS les fichiers .ics créés (CM, TD, TP, EXAM, AUTRE, ALL)
          git add *.ics
          # On ne commit que s'il y a du changement
          git commit -m "Mise à jour automatique des agendas SupOptique" || echo "Pas de changement"
          git push

